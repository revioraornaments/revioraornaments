function normalizeProduct(row) {
  if (!row) return null;
  const images = Array.isArray(row.images) ? row.images
  : Array.isArray(row.product_images) ? row.product_images.sort((a,b)=>a.sort_order-b.sort_order).map(i=>i.image_path): [''];
  return {
    id: row.id, sku: row.model_no || row.sku || '', name: row.name || '',
    slug: row.slug || (row.name || '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
    category: row.category || '', subcategory: row.subcategory || '',
    price: Number(row.price) || 0,
    sale_price: row.sale_price != null && Number(row.sale_price) < Number(row.price) ? Number(row.sale_price) : null,
    currency: row.currency || 'INR', images, art: row.art || 'charm',
    description: row.description || '', material: row.material || '',
    care: row.care_instructions || row.care || '',
    stock: row.stock_quantity != null ? Number(row.stock_quantity) : (row.stock != null ? Number(row.stock) : null),
    availability: row.availability || (row.stock > 0 ? 'in_stock' : 'out_of_stock'),
    published: row.published !== false,
    collection_type: row.collection_type || 'regular',
    createdAt: row.created_at || row.createdAt || '',
  };
}

  if (p.availability === 'out_of_stock') return false;
  if (p.availability === 'made_to_order') return true;
  return p.stock == null || p.stock > 0;
};

function useAsync(fn, deps) {
  const [state, setState] = useState({ loading: true, data: null, error: null });
  useEffect(() => { let alive = true; setState({ loading: true, data: null, error: null });
    Promise.resolve(fn()).then(data => alive && setState({ loading: false, data, error: null })).catch(err => alive && setState({ loading: false, data: null, error: err }));
    return () => { alive = false; };
  }, deps);
  return state;
}

  }, [title, description]);
}

const AuthContext = createContext({ user: null, session: null, loading: true, signInWithGoogle: async () => {}, signOut: async () => {} });
const useAuth = () => useContext(AuthContext);
function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    const sb = getSupabaseClient();
    if (!sb) { setLoading(false); return; }
    sb.auth.getSession().then(({ data }) => { setSession(data?.session || null); setUser(data?.session?.user || null); setLoading(false); });
    const { data: sub } = sb.auth.onAuthStateChange((_event, s) => { setSession(s || null); setUser(s?.user || null); });
    return () => { try { sub.subscription.unsubscribe(); } catch (e) {} };
  }, []);
  const signInWithGoogle = async () => {
    const sb = getSupabaseClient();
    if (!sb) { const demo = { email: 'demo@example.com', name: 'Demo Customer' }; setUser(demo); setSession({ access_token: null, user: demo }); return; }
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
    if (error) throw error;
  };
  const signOut = async () => { const sb = getSupabaseClient(); if (sb) await sb.auth.signOut(); setUser(null); setSession(null); };
  return <AuthContext.Provider value={{ user, session, loading, signInWithGoogle, signOut }}>{children}</AuthContext.Provider>;
}

const CartContext = createContext(null);
const useCart = () => useContext(CartContext);
function CartProvider({ children }) {
  const [open, setOpen] = useState(false);
  const [raw, setRaw] = useState(() => { try { return JSON.parse(localStorage.getItem('reviora_cart_v2') || '[]'); } catch (e) { return []; } });
  const { products } = useCatalog();
  useEffect(() => { try { localStorage.setItem('reviora_cart_v2', JSON.stringify(raw)); } catch (e) {} }, [raw]);
  const items = useMemo(() => raw.map(r => { const p = products.find(pp => pp.id === r.id); if (!p) return null; const qty = Math.max(1, Math.min(r.qty, maxQtyFor(p))); return { ...p, qty, lineTotal: effectivePrice(p) * qty }; }).filter(Boolean), [raw, products]);
  const count = items.reduce((s, it) => s + it.qty, 0);
  const subtotal = items.reduce((s, it) => s + it.lineTotal, 0);
  const originalTotal = items.reduce((s, it) => s + it.price * it.qty, 0);
  const discount = Math.max(0, originalTotal - subtotal);
  const shipping = subtotal === 0 ? 0 : subtotal >= 999 ? 0 : 59;
  const total = subtotal + shipping;
  const addToCart = (product, qty = 1) => {
    if (!isAvailable(product)) return { ok: false, reason: 'unavailable' };
    const max = maxQtyFor(product);
    setRaw(prev => { const found = prev.find(i => i.id === product.id); if (found) return prev.map(i => i.id === product.id ? { ...i, qty: Math.min(found.qty + qty, max) } : i); return [...prev, { id: product.id, qty: Math.min(qty, max) }]; });
    return { ok: true };
  };
  const updateQty = (id, qty) => { const p = products.find(pp => pp.id === id); if (!p) return; const max = maxQtyFor(p); setRaw(prev => prev.map(i => i.id === id ? { ...i, qty: Math.max(1, Math.min(qty, max)) } : i)); };
  const removeFromCart = (id) => setRaw(prev => prev.filter(i => i.id !== id));
  const clearCart = () => setRaw([]);
  return (<CartContext.Provider value={{ items, count, subtotal, discount, shipping, total, addToCart, updateQty, removeFromCart, clearCart, open, setOpen }}>{children}<CartDrawer/></CartContext.Provider>);
}

  );
}

/* ProductRow — desktop: 4 visible, arrows scroll one page. Mobile: horizontal swipe. */
function ProductRow({ products, loading }) {
  const desktopRef = useRef(null);
  const mobileRef = useRef(null);
  const [canLeft, setCanLeft] = useState(false);
  const [canRight, setCanRight] = useState(false);

  const updateArrows = () => {
    const el = desktopRef.current; if (!el) return;
    const maxScroll = el.scrollWidth - el.clientWidth;
    setCanLeft(el.scrollLeft > 4);
    setCanRight(el.scrollLeft < maxScroll - 4);
  };
  useEffect(() => {
    const el = desktopRef.current; if (!el) return;
    updateArrows();
    el.addEventListener('scroll', updateArrows, { passive: true });
    window.addEventListener('resize', updateArrows);
    return () => { el.removeEventListener('scroll', updateArrows); window.removeEventListener('resize', updateArrows); };
  }, [products, loading]);

  const scrollByPage = (dir) => {
    const el = desktopRef.current; if (!el) return;
    el.scrollBy({ left: dir * el.clientWidth, behavior: 'smooth' });
  };

  if (loading) return (
    <>
      <div className="hidden md:grid grid-cols-4 gap-6">{Array.from({length:4}).map((_,i)=><SkeletonCard key={i}/>)}</div>
      <div className="md:hidden flex gap-4 overflow-hidden">{Array.from({length:2}).map((_,i)=><div key={i} className="shrink-0 w-[68%]"><SkeletonCard/></div>)}</div>
    </>
  );

  if (products.length === 0) return null;
  const showArrows = products.length > 4;

  return (
    <div className="relative">
      {/* Desktop: strictly 4 visible, arrows to see more */}
      <div className="hidden md:block relative">
        {showArrows && (
          <button onClick={() => scrollByPage(-1)} aria-label="Scroll left"
            className={cx('absolute -left-3 top-1/2 -translate-y-1/2 z-10 w-11 h-11 flex items-center justify-center rounded-full bg-ivory border border-beige shadow-md text-cocoa hover:bg-gold hover:text-ivory hover:border-gold transition-all duration-300', !canLeft && 'opacity-0 pointer-events-none')}>
            <IconArrowLeft className="w-4 h-4"/>
          </button>
        )}
        {showArrows && (
          <button onClick={() => scrollByPage(1)} aria-label="Scroll right"
            className={cx('absolute -right-3 top-1/2 -translate-y-1/2 z-10 w-11 h-11 flex items-center justify-center rounded-full bg-ivory border border-beige shadow-md text-cocoa hover:bg-gold hover:text-ivory hover:border-gold transition-all duration-300', !canRight && 'opacity-0 pointer-events-none')}>
            <IconArrow className="w-4 h-4"/>
          </button>
        )}
        <div ref={desktopRef} className="row-desktop-track no-scrollbar">
          {products.map(p => (<div key={p.id} className="min-w-0"><ProductCard product={p}/></div>))}
        </div>
      </div>

      {/* Mobile: swipe */}
      <div ref={mobileRef} className="md:hidden row-mobile-track no-scrollbar">
        {products.map(p => (<div key={p.id}><ProductCard product={p}/></div>))}
      </div>
    </div>
  );
}

}
function CategoryPage({ slug }) { const cat = ALL_CATS.find(c => c.slug === slug); if (!cat) return <NotFound/>; return <Shop preset={cat}/>; }

        <Reveal delay={120}>
          <div>
            <p className="text-[10px] font-semibold tracking-[0.3em] uppercase text-gold">{product.category}{product.subcategory ? ' · ' + product.subcategory : ''}</p>

            <p className="mt-4 text-2xl">{hasSale(product) ? (<><span className="line-through text-cocoa/40 text-lg mr-2">{formatPrice(product.price)}</span><span className="text-gold">{formatPrice(effectivePrice(product))}</span></>) : formatPrice(product.price)}<span className="text-xs text-cocoa/50 tracking-widest uppercase ml-2">{product.currency}</span></p>
            <div className="mt-4 flex flex-wrap items-center gap-3"><span className="text-[10px] tracking-[0.2em] uppercase text-cocoa/50">SKU · {product.sku}</span>{product.availability === 'out_of_stock' ? <Badge tone="cocoa">Out of Stock</Badge> : product.availability === 'made_to_order' ? <Badge tone="gold">Made to Order</Badge> : <Badge tone="gold">In Stock</Badge>}</div>

            <dl className="mt-6 space-y-2 text-sm">

              {product.care && <div className="flex gap-3"><dt className="text-[10px] tracking-[0.2em] uppercase text-cocoa/50 w-24 pt-0.5">Care</dt><dd className="text-cocoa/80">{product.care}</dd></div>}

              <div className="mt-5 grid sm:grid-cols-3 gap-2.5">

          </div>
        </Reveal>
      </div>
      {related.length > 0 && (<section className="mt-20 md:mt-28"><Reveal><SectionHeading eyebrow="Complete the look" title="You may also love" align="left" linkTo={`/category/${(product.category || '').toLowerCase().replace(/\s+/g,'-')}`} linkLabel="View category"/></Reveal><Reveal delay={100}><ProductRow products={related}/></Reveal></section>)}
    </main>
  );
}

function Checkout() {
  useSEO({ title: 'Checkout' });
  const { user, session, signInWithGoogle } = useAuth();
  const { items, subtotal, discount, shipping, total } = useCart();
  const { notify } = useToast();
  const [form, setForm] = useState({ name: '', address: '', city: '', state: '', postal: '', country: 'India', phone: '', email: user?.email || '', marketing: false });
  const [agreeTerms, setAgreeTerms] = useState(false);
  const [agreeShipping, setAgreeShipping] = useState(false);
  const [otpSent, setOtpSent] = useState(false);
  const [otp, setOtp] = useState('');
  const [otpVerified, setOtpVerified] = useState(false);
  const [cooldown, setCooldown] = useState(0);
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (user && !form.email) setForm(f => ({ ...f, email: user.email })); }, [user]);
  useEffect(() => { if (cooldown <= 0) return; const t = setTimeout(() => setCooldown(c => c - 1), 1000); return () => clearTimeout(t); }, [cooldown]);
  if (!user) return (<main className="max-w-md mx-auto px-4 py-16 text-center"><PageHero eyebrow="Checkout" title="Sign in to continue" subtitle="A verified Google account is required so we can link your order securely."/><button onClick={signInWithGoogle} className="inline-flex items-center justify-center gap-3 rounded-full border border-cocoa/30 hover:border-gold hover:text-gold px-6 py-3.5 text-[11px] font-semibold tracking-[0.2em] uppercase transition-colors"><IconGoogle className="w-4 h-4"/>Continue with Google</button></main>);
  if (items.length === 0) return (<main className="max-w-md mx-auto px-4 py-16 text-center"><IconSparkle className="w-6 h-6 text-gold mx-auto"/><h1 className="serif text-3xl mt-4">Your cart is empty</h1><p className="text-sm text-cocoa/65 mt-2">Add a piece before checking out.</p><div className="mt-6"><Btn to="/shop">Shop the Collection</Btn></div></main>);
  const sendOtp = async () => {
    if (!form.phone) return notify('Please enter your phone number');
    if (cooldown > 0) return;
    setBusy(true);
    try { await EdgeAPI.call('send-otp', { phone: form.phone }); setOtpSent(true); setCooldown(30); }
    catch (e) { notify(e.message || 'Could not send OTP'); }
    finally { setBusy(false); }
  };
  const verifyOtp = async () => {
    if (!/^\d{6}$/.test(otp)) return notify('Enter the 6-digit code');
    setBusy(true);
    try { const r = await EdgeAPI.call('verify-otp', { phone: form.phone, code: otp }); if (!r.verified) throw new Error(r.error || 'Verification failed'); setOtpVerified(true); notify('Phone verified ✓'); }
    catch (e) { notify(e.message || 'Verification failed'); }
    finally { setBusy(false); }
  };
  const validators = { name: v => v.trim().length >= 2 || 'Enter your full name', address: v => v.trim().length >= 6 || 'Enter your delivery address', city: v => v.trim().length >= 2 || 'Enter your city', state: v => v.trim().length >= 2 || 'Enter your state', postal: v => /^\d{4,10}$/.test(v.trim()) || 'Enter a valid postal code', country: v => v.trim().length >= 2 || 'Enter your country', phone: v => /^\+?\d{6,15}$/.test(v.replace(/\s|-/g,'')) || 'Enter a valid phone number' };
  const submitOrder = async () => {
    for (const [k, test] of Object.entries(validators)) { const r = test(form[k] || ''); if (r !== true) { notify(r); return; } }
    if (!otpVerified) return notify('Please verify your phone number');
    if (!agreeTerms) return notify('Please accept the Terms & Conditions');
    if (!agreeShipping) return notify('Please accept the Shipping Policy');
    if (!CONFIG.PAYMENT_CONFIG.enabled) { notify('Checkout is temporarily unavailable — payment provider not yet configured.'); return; }
    setBusy(true);
    try { const payload = { customer: { ...form, email: user.email }, items: items.map(it => ({ product_id: it.id, qty: it.qty })), agreements: { terms: agreeTerms, shipping: agreeShipping, marketing: form.marketing } }; const r = await EdgeAPI.call('checkout', payload, { userToken: session?.access_token }); if (r.payment_url) window.location.href = r.payment_url; else notify(r.message || 'Order submitted'); }
    catch (e) { notify(e.message || 'Could not submit order'); }
    finally { setBusy(false); }
  };
  const field = (name, label, type = 'text', extra = {}) => (<label className="block"><span className="text-[10px] font-bold tracking-[0.25em] uppercase text-cocoa/60">{label}</span><input type={type} value={form[name]} {...extra} onChange={e => setForm(f => ({ ...f, [name]: e.target.value }))} className="mt-1.5 w-full bg-white border border-beige rounded-xl px-4 py-3 text-sm outline-none focus:border-gold transition-colors"/></label>);
  return (
    <main className="max-w-5xl mx-auto px-4 sm:px-6 py-10 md:py-14">
      <Reveal><header className="text-center fade-up mb-10"><p className="text-[10px] font-semibold tracking-[0.35em] uppercase text-gold flex items-center justify-center gap-2"><IconSparkle className="w-2.5 h-2.5"/>Secure Checkout</p><h1 className="serif text-4xl md:text-5xl mt-3">Checkout</h1></header></Reveal>
      <div className="grid lg:grid-cols-[1fr_360px] gap-8">
        <div className="space-y-6">
          <section className="rounded-3xl border border-beige bg-ivory p-6"><p className="serif text-xl">Delivery details</p><div className="mt-4 grid sm:grid-cols-2 gap-4">{field('name', 'Full name')}{field('email', 'Email (from Google)', 'email', { readOnly: true })}{field('phone', 'Phone (with country code)', 'tel', { placeholder: '+91 99999 99999' })}{field('postal', 'Postal code')}<div className="sm:col-span-2">{field('address', 'Full address')}</div>{field('city', 'City')}{field('state', 'State')}{field('country', 'Country')}</div></section>
          <section className="rounded-3xl border border-beige bg-ivory p-6"><p className="serif text-xl">Verify your phone</p><p className="text-xs text-cocoa/65 mt-1">We'll send a 6-digit code by SMS. The code is verified on our server.</p><div className="mt-4 flex flex-wrap gap-3 items-center"><button onClick={sendOtp} disabled={busy || cooldown > 0 || otpVerified} className="px-5 py-3 rounded-full bg-cocoa text-ivory text-[10px] font-semibold tracking-[0.2em] uppercase hover:bg-gold transition-colors disabled:opacity-40">{otpVerified ? 'Verified ✓' : cooldown > 0 ? `Resend in ${cooldown}s` : 'Get OTP'}</button>{otpSent && !otpVerified && (<><input value={otp} onChange={e => setOtp(e.target.value.replace(/\D/g,'').slice(0,6))} placeholder="6-digit code" className="w-32 bg-white border border-beige rounded-full px-4 py-2.5 text-sm tracking-[0.3em] text-center outline-none focus:border-gold" inputMode="numeric" maxLength={6}/><button onClick={verifyOtp} disabled={busy} className="px-5 py-3 rounded-full border border-cocoa/30 text-[10px] font-semibold tracking-[0.2em] uppercase hover:border-gold hover:text-gold transition-colors disabled:opacity-40">Verify</button></>)}</div>{!SupabaseREST.isConfigured() && (<p className="mt-3 text-[10px] text-cocoa/50 italic">Supabase isn't configured — OTP functions won't respond until it is.</p>)}</section>
          <section className="rounded-3xl border border-beige bg-ivory p-6 space-y-3"><p className="serif text-xl">Agreements</p><label className="flex items-start gap-3 text-sm cursor-pointer"><input type="checkbox" className="mt-1 accent-[#A68A5B]" checked={agreeTerms} onChange={e => setAgreeTerms(e.target.checked)}/><span>I agree to the <Link to="/terms" className="text-gold underline underline-offset-4">Terms & Conditions</Link>. <strong className="text-[10px] tracking-[0.2em] uppercase text-gold">Required</strong></span></label><label className="flex items-start gap-3 text-sm cursor-pointer"><input type="checkbox" className="mt-1 accent-[#A68A5B]" checked={agreeShipping} onChange={e => setAgreeShipping(e.target.checked)}/><span>I agree to the <Link to="/shipping" className="text-gold underline underline-offset-4">Shipping Policy</Link>. <strong className="text-[10px] tracking-[0.2em] uppercase text-gold">Required</strong></span></label><label className="flex items-start gap-3 text-sm cursor-pointer"><input type="checkbox" className="mt-1 accent-[#A68A5B]" checked={form.marketing} onChange={e => setForm(f => ({ ...f, marketing: e.target.checked }))}/><span>Send me emails about new products. <span className="text-[10px] tracking-[0.2em] uppercase text-cocoa/50">Optional</span></span></label></section>
          {!CONFIG.PAYMENT_CONFIG.enabled && (<div className="rounded-3xl border-2 border-dashed border-gold/50 bg-gold/5 p-6 text-center"><IconSparkle className="w-5 h-5 text-gold mx-auto"/><p className="serif text-xl mt-3">Checkout is temporarily unavailable</p><p className="text-sm text-cocoa/70 mt-2 max-w-md mx-auto">A payment provider hasn't been configured yet, so orders can't be submitted. Please DM us on Instagram.</p><div className="mt-4"><Btn href={INSTAGRAM_DM_URL} variant="outline" size="sm"><IconInstagram className="w-3.5 h-3.5"/>DM us on Instagram</Btn></div></div>)}
        </div>
        <aside className="lg:sticky lg:top-24 h-fit"><div className="rounded-3xl border border-beige bg-ivory p-6"><p className="serif text-xl">Order summary</p><ul className="mt-4 space-y-3 divide-y divide-beige/50">{items.map(it => (<li key={it.id} className="pt-3 first:pt-0 flex gap-3"><span className="block w-12 h-14 rounded-lg overflow-hidden border border-beige/70 shrink-0 bg-white"><ProductImage product={it}/></span><span className="flex-1 min-w-0"><span className="serif text-base block truncate">{it.name}</span><span className="text-[10px] tracking-[0.18em] uppercase text-cocoa/50">{it.sku} · × {it.qty}</span></span><span className="text-sm">{formatPrice(it.lineTotal)}</span></li>))}</ul><dl className="mt-4 pt-4 border-t border-beige/60 space-y-1.5 text-sm"><div className="flex justify-between"><dt className="text-cocoa/60">Subtotal</dt><dd>{formatPrice(subtotal)}</dd></div>{discount > 0 && <div className="flex justify-between text-gold"><dt>Savings</dt><dd>− {formatPrice(discount)}</dd></div>}<div className="flex justify-between"><dt className="text-cocoa/60">Shipping</dt><dd>{shipping === 0 ? 'Free' : formatPrice(shipping)}</dd></div><div className="flex justify-between border-t border-beige/60 pt-2 mt-2"><dt className="text-[10px] tracking-[0.25em] uppercase text-cocoa/60">Total</dt><dd className="serif text-xl">{formatPrice(total)}</dd></div></dl><button onClick={submitOrder} disabled={busy || !CONFIG.PAYMENT_CONFIG.enabled} className="mt-5 w-full rounded-full bg-cocoa text-ivory text-[11px] font-semibold tracking-[0.2em] uppercase py-4 hover:bg-gold transition-colors disabled:opacity-40 disabled:cursor-not-allowed">{CONFIG.PAYMENT_CONFIG.enabled ? 'Place Order' : 'Checkout Unavailable'}</button><p className="mt-3 text-[10px] text-cocoa/50 text-center">Totals are re-validated on the server before payment.</p></div></aside>
      </div>
    </main>
  );
}

function FAQ() {
  useSEO({ title: 'FAQ' });
  return (<main><PageHero eyebrow="Help centre" title="Frequently Asked Questions" subtitle="Everything about ordering, delivery and caring for your pieces."/><Reveal><section className="max-w-3xl mx-auto px-4 pb-6"><Accordion items={FAQS}/><div className="mt-10 rounded-2xl border border-beige bg-white p-6 text-center"><p className="serif text-xl">Still have a question?</p><p className="text-sm text-cocoa/70 mt-1">Need help? DM us on Instagram.</p><div className="mt-4"><Btn href={INSTAGRAM_DM_URL} variant="outline" size="sm"><IconInstagram className="w-3.5 h-3.5"/>@{CONFIG.INSTAGRAM_USERNAME}</Btn></div></div></section></Reveal></main>);
}
function Shipping() {
  useSEO({ title: 'Shipping & Delivery' });
  return (<main><PageHero eyebrow="Good to know" title="Shipping & Delivery"/><Reveal><section className="max-w-2xl mx-auto px-4 prose"><div className="rounded-2xl border border-gold/40 bg-white p-5 mb-8"><p className="text-sm italic text-cocoa/70">📦 Shipping information will be updated here. Please DM us for the latest estimate.</p></div><h2>How shipping works</h2><ul><li>All orders confirmed at checkout before dispatch.</li><li><strong>Processing time:</strong> [update].</li><li><strong>Delivery time:</strong> [update].</li><li><strong>Shipping charges:</strong> Free above ₹999; flat fee below.</li><li><strong>Tracking:</strong> shared once dispatched [update].</li></ul><h2>Order status</h2><p>DM us with your Order ID (e.g. RV-2026-0001) and we'll update you.</p></section></Reveal></main>);
}
function Returns() {
  useSEO({ title: 'Returns & Exchange' });
  return (<main><PageHero eyebrow="Good to know" title="Returns & Exchange" subtitle="We want you to love every Reviora piece."/><Reveal><section className="max-w-2xl mx-auto px-4 prose"><div className="rounded-2xl border border-gold/40 bg-white p-5 mb-8"><p className="text-sm italic text-cocoa/70">Please check our current return policy before ordering.</p></div><h2>Return policy</h2><ul><li><strong>Return window:</strong> [update].</li><li><strong>Eligibility:</strong> [update].</li><li><strong>How to request:</strong> DM us with Order ID + photos.</li><li><strong>Non-returnable:</strong> [update].</li></ul><h2>Exchanges</h2><ul><li>Subject to stock availability.</li><li><strong>Exchange shipping:</strong> [update].</li></ul></section></Reveal></main>);
}
function Care() {
  useSEO({ title: 'Jewellery Care' });
  return (<main><PageHero eyebrow="Make it last" title="Jewellery Care" subtitle="Small habits keep your pieces looking new."/><Reveal><section className="max-w-2xl mx-auto px-4 prose"><ul><li><strong>Keep it dry.</strong> Remove before showering, swimming or sleeping.</li><li><strong>Last on, first off.</strong> After perfume, lotion and makeup.</li><li><strong>Wipe after wear.</strong> Soft dry cloth removes oils and moisture.</li><li><strong>Store separately.</strong> In a pouch or box, away from sunlight.</li><li><strong>Avoid chemicals.</strong> Cleaners, chlorine and salt water can dull the finish.</li></ul></section></Reveal></main>);
}
function Contact() {
  useSEO({ title: 'Contact' });
  const cards = [{ icon: <IconInstagram className="w-5 h-5"/>, t: 'Orders & Products', d: 'Questions about a piece — DM us.' }, { icon: <IconSparkle className="w-5 h-5"/>, t: 'Order Status', d: 'Send us your Order ID.' }, { icon: <IconHeart className="w-5 h-5"/>, t: 'Something Else', d: 'Collaborations, gifting or saying hi.' }];
  return (<main><PageHero eyebrow="We'd love to hear from you" title="Contact Reviora" subtitle="The fastest way to reach us is Instagram."/><Reveal><section className="max-w-4xl mx-auto px-4 grid sm:grid-cols-3 gap-4">{cards.map(c => (<div key={c.t} className="rounded-2xl border border-beige/70 bg-white p-6 text-center transition-all duration-300 hover:border-gold/60 hover:shadow-lg hover:shadow-gold/10 hover:-translate-y-1"><span className="w-11 h-11 rounded-full border border-gold/40 text-gold inline-flex items-center justify-center">{c.icon}</span><p className="serif text-xl mt-3">{c.t}</p><p className="text-xs text-cocoa/65 mt-2 leading-relaxed">{c.d}</p></div>))}</section></Reveal><section className="text-center mt-12 pb-4"><Btn href={INSTAGRAM_DM_URL} variant="gold" size="lg" onClick={() => Analytics.track('instagram_click', { context: 'contact' })}><IconInstagram className="w-4 h-4"/>DM us on Instagram</Btn><p className="mt-3 text-[10px] tracking-[0.25em] uppercase text-cocoa/50">@{CONFIG.INSTAGRAM_USERNAME}</p></section></main>);
}
function Terms() {
  useSEO({ title: 'Terms & Conditions' });
  return (<main><PageHero eyebrow="The fine print" title="Terms & Conditions" subtitle="Last updated: [add date before launch]"/><Reveal><section className="max-w-2xl mx-auto px-4 prose"><h2>1. Ordering</h2><ul><li>Orders via secure checkout or Instagram DM.</li><li>Order final only after availability + payment confirmed.</li></ul><h2>2. Payment</h2><ul><li><strong>Cash on Delivery is not provided.</strong></li><li>Payment through online provider once checkout enabled.</li><li>Dispatch after payment confirmed.</li></ul><h2>3. Prices & Availability</h2><ul><li>All prices in INR.</li><li>Stock is indicative.</li></ul><h2>4. Shipping</h2><p>See <Link to="/shipping" className="text-gold underline underline-offset-4">Shipping & Delivery</Link>.</p><h2>5. Returns</h2><p>See <Link to="/returns" className="text-gold underline underline-offset-4">Returns & Exchange</Link>.</p><h2>6. Privacy</h2><p>See <Link to="/privacy" className="text-gold underline underline-offset-4">Privacy & Cookies</Link>.</p><h2>7. Contact</h2><p>DM us on Instagram — <strong>@{CONFIG.INSTAGRAM_USERNAME}</strong>.</p></section></Reveal></main>);
}
function Privacy() {
  useSEO({ title: 'Privacy & Cookies' });
  const { openPreferences, consent } = useConsent();
  return (<main><PageHero eyebrow="The fine print" title="Privacy & Cookies" subtitle="What we store, why, and how you can change your choices."/><Reveal><section className="max-w-2xl mx-auto px-4 prose"><h2>What we store</h2><ul><li><strong>Necessary:</strong> cart, consent, session.</li><li><strong>Analytics:</strong> optional, off by default.</li><li><strong>Marketing:</strong> optional, off by default.</li></ul><h2>Orders and accounts</h2><ul><li>Cart lives in your browser.</li><li>Order details stored only for fulfilment.</li><li>Sign-in uses Google via Supabase.</li></ul><h2>Your choices</h2><p>Analytics consent: <strong>{consent.analytics ? 'Granted' : 'Denied'}</strong>.</p><p><button onClick={openPreferences} className="text-gold underline underline-offset-4">Open cookie preferences</button></p></section></Reveal></main>);
}
function NotFound({ message = 'This page wandered off.' }) {
  useSEO({ title: 'Page Not Found' });
  return (<main className="max-w-xl mx-auto px-4 py-24 text-center fade-up"><IconSparkle className="w-6 h-6 text-gold mx-auto twinkle"/><h1 className="serif text-4xl mt-6">{message}</h1><p className="text-cocoa/70 mt-3">Find your next favourite piece instead.</p><div className="mt-8 flex justify-center gap-3"><Btn to="/shop">Shop the Collection</Btn><Btn href={INSTAGRAM_DM_URL} variant="outline"><IconInstagram className="w-4 h-4"/>DM Us</Btn></div></main>);
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() { if (this.state.err) return (<div className="min-h-screen flex items-center justify-center px-4 text-center"><div><IconSparkle className="w-6 h-6 text-gold mx-auto"/><h1 className="serif text-3xl mt-4">Something went wrong.</h1><p className="text-sm text-cocoa/60 mt-2">Please refresh.</p><div className="mt-6"><Btn onClick={() => window.location.reload()}>Refresh</Btn></div></div></div>); return this.props.children; }
}
function App() {
  const route = useRoute();
  const [searchOpen, setSearchOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => { setSearchOpen(false); setMenuOpen(false); }, [route.path]);
  useEffect(() => { const onKey = (e) => { const tag = (e.target.tagName || '').toLowerCase(); if (e.key === '/' && tag !== 'input' && tag !== 'textarea') { e.preventDefault(); setSearchOpen(true); } }; window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, []);
  const seg = route.path.split('/').filter(Boolean);
  let page;
  if (seg.length === 0) page = <Home/>;
  else if (seg[0] === 'shop') page = <Shop/>;
  else if (seg[0] === 'category' && seg[1]) page = <CategoryPage slug={seg[1]}/>;
  else if (seg[0] === 'product' && seg[1]) page = <ProductPage slug={seg[1]}/>;
  else if (seg[0] === 'login') page = <Login/>;
  else if (seg[0] === 'account') page = <Account/>;
  else if (seg[0] === 'checkout') page = <Checkout/>;
  else if (seg[0] === 'about') page = <About/>;
  else if (seg[0] === 'faq') page = <FAQ/>;
  else if (seg[0] === 'shipping') page = <Shipping/>;
  else if (seg[0] === 'returns') page = <Returns/>;
  else if (seg[0] === 'care') page = <Care/>;
  else if (seg[0] === 'contact') page = <Contact/>;
  else if (seg[0] === 'terms') page = <Terms/>;
  else if (seg[0] === 'privacy') page = <Privacy/>;
  else page = <NotFound/>;
  return (<div className="min-h-screen flex flex-col overflow-x-hidden"><Header searchOpen={searchOpen} setSearchOpen={setSearchOpen} menuOpen={menuOpen} setMenuOpen={setMenuOpen}/><div className="flex-1">{page}</div><Footer/><MenuDrawer open={menuOpen} onClose={() => setMenuOpen(false)}/><SearchOverlay open={searchOpen} onClose={() => setSearchOpen(false)}/><FloatingInstagram/></div>);
}
const Root = () => (<ErrorBoundary><RouterProvider><CatalogProvider><ConsentProvider><ToastProvider><AuthProvider><CartProvider><App/></CartProvider></AuthProvider></ToastProvider></ConsentProvider></CatalogProvider></RouterProvider></ErrorBoundary>);
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>

<script>
(function () {
  var REACT = ['https://unpkg.com/react@18.3.1/umd/react.production.min.js','https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'];
  var REACT_DOM = ['https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js','https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js'];
  var BABEL = ['https://unpkg.com/@babel/standalone@7.24.7/babel.min.js','https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js','https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js'];
  var TAILWIND = ['https://cdn.tailwindcss.com/3.4.16'];
  function loadScript(urls, onDone) { var i = 0; (function next() { if (i >= urls.length) return onDone(false); var s = document.createElement('script'); s.src = urls[i++]; s.onload = function () { onDone(true); }; s.onerror = next; document.head.appendChild(s); })(); }
  function showBootError() { var ld = document.getElementById('boot-loading'); var el = document.getElementById('boot-error'); if (ld) ld.style.display = 'none'; if (el) el.style.display = 'flex'; }
  loadScript(TAILWIND, function (okTw) {
    if (okTw && window.tailwind) { tailwind.config = { theme: { extend: { colors: { cream: '#F6EFE5', ivory: '#FFFDF9', cocoa: '#4A3B2A', gold: '#A68A5B', beige: '#DCCBB4' }, fontFamily: { serif: ['"Cormorant Garamond"', 'serif'], sans: ['Manrope', 'sans-serif'] } } } }; }
    loadScript(REACT, function (okR) {
      if (!okR) return showBootError();
      loadScript(REACT_DOM, function (okD) {
        if (!okD) return showBootError();
        loadScript(BABEL, function (okB) {
          if (!okB) return showBootError();
          try { var src = document.getElementById('reviora-app').textContent; var compiled = Babel.transform(src, { presets: ['react'] }).code; var runner = document.createElement('script'); runner.text = compiled; document.body.appendChild(runner); var ld = document.getElementById('boot-loading'); if (ld) ld.remove(); } catch (e) { console.error(e); showBootError(); }
        });
      });
    });
  });
})();
</script>
</body>
</html>
